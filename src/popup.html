<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sharpmd</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfaf7; --fg: #1d2026; --muted: #5c6370; --line: #dedbd2; --soft: #f1efe9; --accent: #4d7c0f; --ok: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121418; --fg: #e6e8ec; --muted: #a0a7b4; --line: #2a2e37; --soft: #1a1d23; --accent: #bef264; --ok: #4ade80; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 290px; padding: 14px; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  h1 { margin: 0; font-size: 15px; flex: 1; }
  svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .row { display: flex; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); color: var(--fg); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.fill { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.coffee { margin-top: 8px; font-weight: 500; color: var(--muted); background: transparent; }
  .btn.coffee:hover { color: var(--accent); border-color: var(--accent); }
  .note { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 12.5px; }
  .note b { color: var(--fg); }
  .note button { margin-top: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  .ver { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
  .ver span:first-child { flex: 1; }
  .ver .ok { color: var(--ok); }
  .ver .bad { color: #dc2626; }
  .ver button { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .ver button:hover { background: var(--soft); color: var(--fg); }
  .ver svg { width: 15px; height: 15px; }
  .spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .upd { margin-top: 12px; padding: 11px 12px; border: 1px solid var(--accent); border-radius: 9px; background: var(--soft); font-size: 12.5px; color: var(--muted); }
  .upd b { display: block; color: var(--fg); font-size: 13.5px; }
  .upd p { margin: 4px 0 9px; }
  .upd .btn { padding: 7px 10px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <h1>Sharpmd</h1>
  </header>
  <div class="note" id="file-note" hidden>
    <b data-t>Falta un permiso para abrir archivos locales.</b><br>
    <span data-t>En los detalles de la extensión, activá "Permitir acceso a URL de archivo".</span>
    <br><button id="open-details" type="button" data-t>Abrir los detalles</button>
  </div>
  <div class="row">
    <button class="btn fill" id="new-file" type="button">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span data-t>Nuevo</span>
    </button>
    <button class="btn" id="open-app" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 18.5V6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h7.4A1.5 1.5 0 0 1 20 8.7V10"/><path d="M3 18.5 5.6 11a1.5 1.5 0 0 1 1.4-1h13.2a1 1 0 0 1 .9 1.4L18.6 18a1.5 1.5 0 0 1-1.4 1H3.6"/></svg>
      <span data-t>Abrir</span>
    </button>
  </div>
  <a class="btn coffee" id="sponsor" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24"><path d="M5 9h11v5.5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 5 14.5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2.5M11.5 3.5v2.5"/></svg>
    <span data-t>Invitame un café</span>
  </a>
  <div class="upd" id="upd" hidden>
    <b id="upd-title"></b>
    <p data-t>Descargá el ZIP, reemplazá la carpeta de la extensión y tocá Aplicar.</p>
    <div class="row">
      <a class="btn fill" id="upd-get" target="_blank" rel="noopener noreferrer" href="https://github.com/MR-Axel/sharpmd/archive/refs/heads/main.zip" data-t>Descargar</a>
      <button class="btn" id="upd-apply" type="button" data-t>Aplicar</button>
    </div>
  </div>
  <div class="ver" id="ver" hidden>
    <span id="ver-num"></span><span id="ver-state"></span>
    <button id="ver-check" type="button"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
  </div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
