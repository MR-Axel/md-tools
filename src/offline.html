<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpMD: offline</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- La página sin conexión. El service worker (sw.js) la guarda al instalarse y la devuelve cuando alguien navega
     a una página del sitio que no tiene guardada y la red no contesta. No pide nada: estilos y logo van adentro. -->
<style>
  :root { color-scheme: light dark; --bg: #fbfaf7; --soft: #f1efe9; --fg: #1d2026; --muted: #5c6370; --line: #dedbd2; --fill: #4d7c0f; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121418; --soft: #1a1d23; --fg: #e8eaee; --muted: #a4abb7; --line: #2a2e37; --fill: #c5f467; --on: #14161a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 400 17px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  main { width: min(440px, 100%); text-align: center; }
  svg { width: 56px; height: 56px; border-radius: 13px; }
  h1 { margin: 22px 0 8px; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em; }
  p { margin: 0 0 24px; color: var(--muted); }
  .ways { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 11px 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--fg); font-weight: 650; line-height: 1.2; text-decoration: none; }
  a.fill { background: var(--fill); border-color: var(--fill); color: var(--on); }
  a:focus-visible { outline: 2px solid var(--fill); outline-offset: 3px; }
  html[data-lang="en"] [lang="es"], html[data-lang="es"] [lang="en"] { display: none; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#14161a"/><g fill="#f3f5f8"><rect x="14.5" y="17" width="6" height="30" rx="1.3"/><rect x="26.5" y="17" width="6" height="30" rx="1.3"/><rect x="8.5" y="23.25" width="30" height="6" rx="1.3"/><rect x="8.5" y="34.75" width="30" height="6" rx="1.3"/></g><rect x="43.5" y="15" width="11" height="34" rx="2.4" fill="#c5f467"/></svg>
  <div lang="en">
    <h1>No connection</h1>
    <p>This page is not saved on this device. The app opens without a connection.</p>
    <p class="ways"><a class="fill" href="" data-retry>Try again</a><a href="/src/app.html" data-app>Open the app</a></p>
  </div>
  <div lang="es">
    <h1>Sin conexión</h1>
    <p>Esta página no está guardada en este dispositivo. La app abre sin conexión.</p>
    <p class="ways"><a class="fill" href="" data-retry>Reintentar</a><a href="/src/app.html" data-app>Abrir la app</a></p>
  </div>
</main>
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('mdtools:site-lang'); } catch (e) { /* sin almacenamiento */ }
  var es = saved ? saved === 'es' : /^es\b/i.test(navigator.language || '');
  if (es) { document.documentElement.setAttribute('data-lang', 'es'); document.documentElement.lang = 'es'; document.title = 'SharpMD: sin conexión'; }
  // Desde la app misma, "Abrir la app" sería el mismo pedido que "Reintentar".
  if (/\/src\/app\.html$/.test(location.pathname)) document.querySelectorAll('[data-app]').forEach(function (a) { a.hidden = true; a.style.display = 'none'; });
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('[data-retry]') : null;
    if (a) { e.preventDefault(); location.reload(); }
  });
  // Cuando vuelve la red, se reintenta sola: una vez, y no otra hasta pasado un rato. Una red que dice estar y no
  // contesta (un wifi que pide entrar) traería de nuevo esta página, y no tiene que quedar recargándose.
  window.addEventListener('online', function () {
    setTimeout(function () {
      if (navigator.onLine === false) return;
      try {
        var last = +sessionStorage.getItem('lmd:offline-retry') || 0;
        if (Date.now() - last < 15000) return;
        sessionStorage.setItem('lmd:offline-retry', String(Date.now()));
      } catch (e) { return; }
      location.reload();
    }, 300);
  });
})();
</script>
</body>
</html>
